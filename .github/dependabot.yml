version: 2
updates:
  # Dev dependencies only — this library ships zero runtime dependencies.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Two groups with identical membership, because `applies-to` defaults to
      # version updates: without the second one, security advisories bypass
      # grouping entirely and arrive as one pull request per package. A single
      # mermaid-cli upgrade landed as two that way. Both patterns take
      # everything — a package with zero runtime dependencies has nothing here
      # but dev tooling.
      dev-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
      security-advisories:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # typescript-eslint constrains typescript with a peer range, so a major
      # bump arriving on its own makes `npm ci` fail before any test runs. Move
      # the two together, by hand.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # @types/node tracks the engines floor (Node 22), not the newest release:
      # newer types would let code compile against APIs the supported runtime
      # does not have.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
