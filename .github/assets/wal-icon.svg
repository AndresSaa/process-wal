<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" width="100%" height="100%">
    <!-- Capa 1: Superior (Buffer / Memory Input) -->
    <rect x="108" y="15" width="296" height="96" rx="48" fill="#9e74f818" stroke="#9e74f8" stroke-width="30"></rect>

    <!-- Flujo 1: Conector Entrada (Capa Superior Buffer -> Capa Central WAL) -->
    <path d="M 404 63 H 469 A 28 28 0 0 1 497 91 V 228 A 28 28 0 0 1 469 256 H 444" fill="none" stroke="#9e74f8" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"></path>

    <!-- Flujo 2: Conector Salida (Capa Central WAL -> Capa Inferior Storage) -->
    <path d="M 68 256 H 43 A 28 28 0 0 0 15 284 V 421 A 28 28 0 0 0 43 449 H 108" fill="none" stroke="#9e74f8" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"></path>

    <!-- Capa 3: Inferior (Storage / Database State) -->
    <rect x="108" y="401" width="296" height="96" rx="48" fill="#9e74f818" stroke="#9e74f8" stroke-width="30"></rect>

    <!-- Capa 2: CENTRAL PROTAGÓNICA (DESTACADA EN VERDE MENTA - Write-Ahead Log) -->
    <rect x="68" y="152" width="376" height="208" rx="28" fill="#74f89e"></rect>

    
    <!-- Líneas Escritas / Registros de Log (Verde oscuro calculado armónicamente) -->
    <g fill="#2c5e3c">
        <rect x="106" y="188" width="300" height="26" rx="13"></rect>
        <rect x="106" y="238" width="230" height="26" rx="13"></rect>
        <rect x="106" y="288" width="276" height="26" rx="13"></rect>
    </g>
    <!-- Destello sutil de escritura activa -->
    <rect x="356" y="238" width="50" height="26" rx="13" fill="#2c5e3c" fill-opacity="0.6"></rect>
    
</svg>