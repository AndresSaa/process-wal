<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" width="100%" height="100%">
    <!-- Capa 1: Superior (Buffer / Memory Input) -->
    <rect x="136" y="72" width="240" height="76" rx="38" fill="#9e74f818" stroke="#9e74f8" stroke-width="24"></rect>

    <!-- Flujo 1: Conector Entrada (Capa Superior Buffer -> Capa Central WAL) -->
    <path d="M 376 110 H 426 A 20 20 0 0 1 446 130 V 236 A 20 20 0 0 1 426 256 H 408" fill="none" stroke="#9e74f8" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"></path>

    <!-- Flujo 2: Conector Salida (Capa Central WAL -> Capa Inferior Storage) -->
    <path d="M 104 256 H 86 A 20 20 0 0 0 66 276 V 382 A 20 20 0 0 0 86 402 H 136" fill="none" stroke="#9e74f8" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"></path>

    <!-- Capa 3: Inferior (Storage / Database State) -->
    <rect x="136" y="364" width="240" height="76" rx="38" fill="#9e74f818" stroke="#9e74f8" stroke-width="24"></rect>

    <!-- Capa 2: CENTRAL PROTAGÓNICA (DESTACADA EN VERDE MENTA - Write-Ahead Log) -->
    <rect x="104" y="188" width="304" height="136" rx="20" fill="#74f89e"></rect>

    
    <!-- Líneas Escritas / Registros de Log (Verde oscuro calculado armónicamente) -->
    <g fill="#2c5e3c">
        <rect x="136" y="214" width="240" height="18" rx="9"></rect>
        <rect x="136" y="247" width="176" height="18" rx="9"></rect>
        <rect x="136" y="280" width="208" height="18" rx="9"></rect>
    </g>
    <!-- Destello sutil de escritura activa -->
    <rect x="324" y="247" width="52" height="18" rx="9" fill="#2c5e3c" fill-opacity="0.6"></rect>
    
</svg>