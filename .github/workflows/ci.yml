name: CI

on:
  push:
    branches: [main]
  # Deliberately unfiltered. Filtering on `branches` matches the *base* branch,
  # so a stacked pull request aimed at another feature branch would run no CI at
  # all — which is exactly how six merged pull requests once reached a branch
  # without a single matrix run behind them.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run coverage
      - run: npm run lint:package
