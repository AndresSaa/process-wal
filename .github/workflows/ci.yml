name: CI

on:
  push:
    branches: [main]
  # Deliberately unfiltered. Filtering on `branches` matches the *base* branch,
  # so a stacked pull request aimed at another feature branch would run no CI at
  # all — which is exactly how six merged pull requests once reached a branch
  # without a single matrix run behind them.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        os: [ubuntu-latest, macos-latest, windows-latest]
        # `engines` says >=22, which claims support for Current as well as the
        # two LTS lines. One leg keeps that claim honest without tripling the
        # matrix for a version nobody deploys yet.
        include:
          - node: 26
            os: ubuntu-latest

    env:
      # mermaid-cli is a dev dependency of the diagram renderer, and its
      # Puppeteer would otherwise pull a ~150 MB Chromium into every leg of
      # this matrix. Nothing here renders a diagram — `check:diagrams` only
      # compares hashes — so skipping the download saves the bandwidth and drops
      # a network dependency that can fail a build for reasons unrelated to the
      # code. A job that actually renders must not set this.
      PUPPETEER_SKIP_DOWNLOAD: "true"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Catches a .mmd or theme edit that was never re-rendered. Deliberately a
      # hash comparison and not an image comparison: Mermaid lays diagrams out
      # with the host's fonts, and no two of these operating systems have the
      # same ones, so regenerating here would differ from the committed asset on
      # every run.
      - run: npm run check:diagrams
      - run: npm run coverage
      - run: npm run lint:package
