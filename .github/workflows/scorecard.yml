name: Scorecard

# Scorecard grades the repository's supply-chain posture — branch protection,
# token permissions, pinned dependencies, release signing. It reads settings and
# history, never the library's behaviour, so it runs on a schedule and on
# landings rather than on every pull request.
on:
  branch_protection_rule:
  schedule:
    - cron: "39 4 * * 1"
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Analyse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Uploads the SARIF result to code scanning.
      security-events: write
      # Mints the OIDC token that publish_results uses to prove the result came
      # from this repository. Without it the badge has nothing to point at.
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Required for both the badge and the public API. It also replaces the
          # OpenSSF team's own weekly scan of this repository with ours.
          publish_results: true

      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
