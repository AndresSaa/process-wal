name: Release

# A release is a tag push, never an automatic reaction to a merge: the version
# bump lands as an ordinary reviewed pull request first, and tagging is the
# deliberate second step that publishes it.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # An npm version is immutable once taken, so a job that hangs is worse than
    # one that fails: it holds the tag in limbo with no signal.
    timeout-minutes: 20
    permissions:
      # contents: write creates the GitHub Release. id-token: write mints the
      # OIDC token npm exchanges for a short-lived credential — it is the whole
      # reason no publish token lives in this repository.
      contents: write
      id-token: write

    env:
      # check:diagrams only compares hashes, so nothing here needs a browser.
      # Publishing is the last job that should depend on a 150 MB download.
      PUPPETEER_SKIP_DOWNLOAD: "true"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so leaving a credential in .git/config only
          # widens what a compromised step could reach.
          persist-credentials: false
          # The tag alone is not enough to prove it descends from main.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # Node 22 ships npm 10, but trusted publishing needs 11.5.1 or newer. On
      # an older CLI the OIDC handshake never happens and npm falls back to an
      # anonymous request, which the registry reports as a misleading 404.
      #
      # Pinned exactly rather than @latest: this job holds an OIDC credential,
      # and `latest` means publishing through whatever was released in the
      # meantime. Bump it deliberately, the way any other dependency is bumped.
      - run: npm install -g npm@12.0.2

      - run: npm ci

      - name: Verify the tag matches package.json
        # A tag disagreeing with the manifest would publish a version nobody
        # reviewed, and npm versions are immutable once taken. Fail before that.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$manifest" ]; then
            echo "tag v$tag does not match package.json $manifest" >&2
            exit 1
          fi

      - name: Verify the tag is on main
        # Matching versions is not enough: a tag can be pushed at any commit,
        # including one that never passed review. Only history that main
        # contains may be published.
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$GITHUB_SHA is not an ancestor of origin/main" >&2
            exit 1
          fi

      - name: Extract the release notes
        # Done before publishing, not after. A missing changelog section used to
        # fail once the version was already immutable on npm — a release half
        # done and impossible to undo.
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { capturing = 1; next }
            capturing && /^## \[/ { exit }
            capturing { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "no CHANGELOG.md section found for $version" >&2
            exit 1
          fi

      # The artifact that ships must be the one the matrix approved, so the same
      # gate runs again here rather than trusting the pull request's green tick.
      # This is every check CI runs, including the coverage thresholds and the
      # diagram check — the comment used to claim that while running less.
      - run: npm run lint
      - run: npm run coverage
      - run: npm run check:diagrams
      - run: npm run lint:package

      # No NODE_AUTH_TOKEN: authentication and the provenance attestation both
      # come from OIDC. publishConfig in package.json carries --access public
      # and --provenance.
      - run: npm publish

      - name: Create the GitHub Release from the changelog entry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag
