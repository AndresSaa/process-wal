name: PR title

# PRs are squash-merged, so the title becomes the commit on main — it must be a
# valid Conventional Commit (see AGENTS.md → GitHub workflow → Commits).
on:
  pull_request_target:
    types: [opened, edited, synchronize]

permissions:
  pull-requests: read

jobs:
  lint-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            test
            chore
            docs
            refactor
            perf
            ci
