name: CodeQL

# Static analysis of the library source. It runs on pull requests and on
# landings rather than only on a schedule, so a finding blocks the change that
# introduced it instead of surfacing days later.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      # CodeQL reads workflow run data to attribute alerts to a run.
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: javascript-typescript
          # Nothing is compiled for analysis: CodeQL reads the TypeScript
          # sources directly, and the tsup build produces only a bundle of the
          # same code.
          build-mode: none

      - uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
